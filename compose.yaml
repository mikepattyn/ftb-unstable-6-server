name: ftb-unstable6

services:
  minecraft:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "${MC_PORT:-25565}:25565/tcp"
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: FTBA
      FTB_MODPACK_ID: "132"
      FTB_MODPACK_VERSION_ID: "${FTB_MODPACK_VERSION_ID:-100507}"
      MEMORY: "${MEMORY:-8G}"
      ONLINE_MODE: "TRUE"
      WHITELIST: "${WHITELIST:?Set WHITELIST in .env to your Minecraft Java profile name}"
      OPS: "${OPS:-}"
      MOTD: "FTB Unstable 6"
    volumes:
      - server_data:/data

volumes:
  server_data:
    name: ftb-unstable6-data
